  InvokeAgentJsWithoutApiGW:
    Type: AWS::Serverless::Function
    Condition: NoApiGateway
    Properties:
      CodeUri: app/javascript/invoke_agent/
      Handler: index.handler
      Runtime: nodejs20.x
      # TODO: increase when testing is completed
      Timeout: 30
      MemorySize: 256
      Architectures:
        - arm64
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          LOG_PRETTY_PRINT: true
          LOG_DESTINATION: CLOUDWATCH
          ORCH_AGENT_ID: !GetAtt OrchestrationAgent.AgentId
          ORCH_AGENT_ALIAS_ID: !GetAtt OrchestrationAgentAlias.AgentAliasId
      Policies:
        - Statement:
            - Sid: BedrockInvokePolicy
              Effect: Allow
              Action:
                - bedrock:InvokeAgent
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/${OrchestrationAgent.AgentId}/*
      Tracing: Active
      Tags:
        Owner: !Ref OwnerTag
        Project: !Ref ResourcePrefix

  InvokeAgentJsWithoutApiGWUrl:
    Type: AWS::Lambda::Url
    Condition: NoApiGateway
    Properties:
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM
      TargetFunctionArn: !GetAtt InvokeAgentJsWithoutApiGW.Arn

  InvokeAgentJsWithoutApiGWInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: NoApiGateway
    Properties:
      Action: 'lambda:InvokeFunctionUrl'
      FunctionName: !GetAtt InvokeAgentJsWithoutApiGW.Arn
      FunctionUrlAuthType: NONE
      Principal: '*'

Outputs:
  ApiUrl:
    Description: URL for the API Gateway
    Value: !Sub 'https://${InvokeAgentApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/query'
    Condition: CreateApiGateway
  OrchestrationAgentId:
    Description: Orchestrator Agent ID
    Value: !GetAtt OrchestrationAgent.AgentId
  OrchestrationAgentAliasId:
    Description: Orchestrator Agent Alias ID
    Value: !GetAtt OrchestrationAgentAlias.AgentAliasId
  TestEvent:
    Description: A test event for the API function
    Value: !Sub '{"lambdaParams":{"isStreaming":"true"},"agentParams":{"agentId":"${OrchestrationAgent.AgentId}","agentAliasId":"${OrchestrationAgentAlias.AgentAliasId}","enableTrace":"true","inputText":"What vehicle has the highest tow rating?"}}'
  ApiTestCall:
    Description: A Test curl command for the API function
    Value: !Sub 'curl -X POST ${InvokeAgentJsWithoutApiGWUrl.FunctionUrl} -H ''Content-Type: application/json'' -d ''{"sessionParams":{"sessionId":"TEST_SESSION","endSession":"false","memoryId":"TEST_MEMORY"},"lambdaParams":{"isStreaming":"true"},"agentParams":{"agentId":"${OrchestrationAgent.AgentId}","agentAliasId":"${OrchestrationAgentAlias.AgentAliasId}","enableTrace":"true","inputText":"What vehicle has the highest tow rating?"}}'' --no-buffer'
    Condition: NoApiGateway
